<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#172c29"><title>Anki — ваша коллекция</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%23172c29'/%3E%3Cpath d='m24 8 4 11 12 5-12 4-4 12-4-12-12-4 12-5z' fill='%23c8edba'/%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<aside class="sidebar">
<a class="brand" href="#decks"><span class="brand-star">✦</span> anki<span class="web-badge">WEB</span></a>
<div class="workspace"><span class="avatar">Я</span><div>Моя коллекция<small>Локальное пространство</small></div><span class="status-dot" title="На этом компьютере"></span></div>
<p class="nav-label">БИБЛИОТЕКА</p>
<nav aria-label="Основная навигация"><a href="#decks" data-nav="decks"><span>▤</span> Колоды <b id="deck-count">0</b></a><a href="#browse" data-nav="browse"><span>⌕</span> Все карточки</a><a href="#stats" data-nav="stats"><span>▥</span> Прогресс</a></nav>
<div class="sidebar-bottom"><div class="storage-label"><i></i> Сохраняется на компьютере</div><p>Немного каждый день.<br>Знания остаются надолго.</p><span class="sidebar-footer">ANKI WEB <span>Версия · 02</span></span></div>
</aside>
<div class="shell"><header class="topbar"><span id="breadcrumb">Библиотека <span>/</span> Колоды</span><div><a class="icon-button" href="#settings" aria-label="Настройки" title="Настройки">⚙</a><button class="icon-button" id="undo-button" aria-label="Отменить последнее действие" disabled>↶</button><button class="icon-button" id="theme-toggle" aria-label="Переключить тему">◐</button><button class="button quiet" id="import-button">↥ <span>Импорт .apkg</span></button><button class="button primary" id="add-button">＋ Добавить карточку</button></div></header>
<main id="main" tabindex="-1"><div class="loading">Открываем коллекцию…</div></main>
<footer class="footer"><span>✦ Место для того, что хочется помнить.</span><button class="button quiet" id="logout-button" hidden>Выйти</button><a href="/api/export" download>Экспорт коллекции ↗</a></footer></div>
<input type="file" id="import-file" accept=".apkg" hidden>
<dialog id="dialog"><div class="dialog-top"><span id="dialog-title"></span><button class="icon-button" id="close-dialog" aria-label="Закрыть">×</button></div><form id="dialog-form"></form></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
</body></html>
