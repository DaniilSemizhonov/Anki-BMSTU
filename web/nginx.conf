user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    # Docker DNS: re-resolve the backend after container recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 100m;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; frame-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://web.telegram.org" always;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }

        location ~ ^/(api(?:/|$)|media(?:/|$)) {
            set $backend http://backend:8765;
            proxy_pass $backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            # Keep request buffering: the Python API expects Content-Length.
            proxy_request_buffering on;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            # Use the application's CSP for API/media, including its media sandbox.
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
